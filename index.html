<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetManager - Parco Auto Aziendale</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 4px;
            color: #38bdf8;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .vehicle-info h3 {
            margin: 0 0 4px 0;
            font-size: 1.1rem;
        }
        .vehicle-info span {
            font-family: monospace;
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge.disponibile {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .badge.in_uso {
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: var(--primary-hover);
        }
        .action-btn.return {
            background: var(--success);
        }
        .action-btn.return:hover {
            background: #059669;
        }
        /* Modale */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }
        .modal-content h3 {
            margin-top: 0;
        }
        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 14px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cancel {
            background: #475569;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚗 FleetManager</h1>
        <p class="subtitle">Gestione parco veicoli aziendale</p>

        <div id="vehicleList"></div>
    </div>

    <!-- Modale Assegnazione / Uscita -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Assegna Veicolo</h3>
            <label>Nome Conducente</label>
            <input type="text" id="driverName" placeholder="es. Mario Rossi">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Annulla</button>
                <button class="action-btn" onclick="confirmCheckout()">Conferma Uscita</button>
            </div>
        </div>
    </div>

    <script>
        // Lista iniziale con i tuoi 6 veicoli
        const defaultVehicles = [
            { id: 1, name: 'Fiat Ducato', plate: 'FD-001-AZ', status: 'disponibile', driver: '' },
            { id: 2, name: 'Fiat Ducato', plate: 'FD-002-AZ', status: 'disponibile', driver: '' },
            { id: 3, name: 'Renault Kangoo', plate: 'RK-003-AZ', status: 'disponibile', driver: '' },
            { id: 4, name: 'Opel Combo', plate: 'OC-004-AZ', status: 'disponibile', driver: '' },
            { id: 5, name: 'Iveco Daily', plate: 'ID-005-AZ', status: 'disponibile', driver: '' },
            { id: 6, name: 'Volkswagen Transporter', plate: 'VT-006-AZ', status: 'disponibile', driver: '' }
        ];

        let vehicles = JSON.parse(localStorage.getItem('my_fleet_vehicles')) || defaultVehicles;
        let activeVehicleId = null;

        function saveAndRender() {
            localStorage.setItem('my_fleet_vehicles', JSON.stringify(vehicles));
            renderVehicles();
        }

        function renderVehicles() {
            const container = document.getElementById('vehicleList');
            container.innerHTML = '';

            vehicles.forEach(v => {
                const isAvailable = v.status === 'disponibile';
                container.innerHTML += `
                    <div class="card">
                        <div class="vehicle-info">
                            <h3>${v.name}</h3>
                            <span>${v.plate}</span>
                            ${!isAvailable ? `<br><small style="color: #38bdf8; margin-top: 4px; display:inline-block;">In uso da: <strong>${v.driver}</strong></small>` : ''}
                        </div>
                        <div>
                            <span class="badge ${v.status}">${isAvailable ? 'Disponibile' : 'In Uso'}</span>
                            <div style="margin-top: 8px; text-align: right;">
                                ${isAvailable 
                                    ? `<button class="action-btn" onclick="openCheckout(${v.id})">Uscita</button>` 
                                    : `<button class="action-btn return" onclick="returnVehicle(${v.id})">Rientro</button>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openCheckout(id) {
            activeVehicleId = id;
            document.getElementById('driverName').value = '';
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('checkoutModal').style.display = 'none';
            activeVehicleId = null;
        }

        function confirmCheckout() {
            const driver = document.getElementById('driverName').value.trim();
            if (!driver) {
                alert('Inserisci il nome del conducente!');
                return;
            }
            vehicles = vehicles.map(v => {
                if (v.id === activeVehicleId) {
                    return { ...v, status: 'in_uso', driver: driver };
                }
                return v;
            });
            closeModal();
            saveAndRender();
        }

        function returnVehicle(id) {
            vehicles = vehicles.map(v => {
                if (v.id === id) {
                    return { ...v, status: 'disponibile', driver: '' };
                }
                return v;
            });
            saveAndRender();
        }

        renderVehicles();
    </script>
</body>
</html>
